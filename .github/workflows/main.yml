name: CI/CD Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy-to-pages:
    name: Build website and deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yaml
